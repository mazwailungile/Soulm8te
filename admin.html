<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Soulm8te</title>
<style>
body{background:#0a0a0a;color:white;font-family:Arial;padding:20px}
.card{background:#1a1a1a;border:1px solid #ff8dc055;border-radius:15px;padding:20px;max-width:600px;margin:20px auto}
.stat{font-size:36px;color:#ff8dc0;font-weight:bold}
.emailRow{background:#222;padding:10px;margin:6px 0;border-radius:8px;font-size:13px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<h1 style="color:#ff8dc0;text-align:center">Soulm8te ADMIN 🔐</h1>

<div class="card">
<div style="display:flex;justify-content:space-around;text-align:center">
<div><div class="stat" id="total">0</div><div style="color:#888;font-size:12px">Total Joins</div></div>
<div><div class="stat" id="money">$0</div><div style="color:#888;font-size:12px">Potential $5 each</div></div>
</div>
</div>

<div class="card">
<h3>📧 Emails Joined:</h3>
<div id="list">Loading...</div>
<button onclick="load()" style="width:100%;padding:12px;background:#ff8dc0;border:none;border-radius:10px;font-weight:bold;margin-top:15px">Refresh 🔄</button>
<button onclick="exportCSV()" style="width:100%;padding:12px;background:#222;color:white;border:1px solid #444;border-radius:10px;margin-top:10px">Export CSV 📥</button>
</div>

<script>
async function load(){
 document.getElementById('list').innerText='Loading...';
 try{
  const res=await fetch('/api/join');
  const data=await res.json();
  const emails=data.emails||[];
  document.getElementById('total').innerText=emails.length;
  document.getElementById('money').innerText='$'+(emails.length*5);
  if(emails.length==0){document.getElementById('list').innerHTML='<p style=color:#888>No emails yet</p>';return;}
  document.getElementById('list').innerHTML=emails.map((e,i)=>`<div class=emailRow><span>${i+1}. ${e.email||e}</span><span style=color:#666>${new Date().toLocaleDateString()}</span></div>`).join('');
  window.allEmails=emails;
 }catch(e){document.getElementById('list').innerText='Error - make sure api/join.js updated!';}
}
function exportCSV(){
 if(!window.allEmails){return alert('No emails');}
 let csv='email\n'+window.allEmails.map(e=>e.email||e).join('\n');
 let blob=new Blob([csv],{type:'text/csv'});
 let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='soulm8te-emails.csv';a.click();
}
load();
</script>
</body>
</html>
