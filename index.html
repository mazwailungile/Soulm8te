<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoulM8te - Your AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0a0a0a;color:#fff;display:flex;flex-direction:column;height:100vh}
header{padding:15px;background:#111;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px} header span{color:#ff3b6e}
#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:12px 15px;border-radius:18px;line-height:1.4;font-size:15px}
.user{align-self:flex-end;background:#ff3b6e;color:#fff;border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:#1c1c1c;border:1px solid #2a2a2a;border-bottom-left-radius:4px}
.msg img{max-width:100%;border-radius:12px;margin-bottom:8px;display:block}
#inputArea{display:flex;gap:8px;padding:12px;background:#111;border-top:1px solid #222;align-items:center}
#inputArea input[type=text]{flex:1;padding:13px 15px;border-radius:25px;border:none;background:#222;color:#fff;outline:none}
button{border:none;cursor:pointer}
#picBtn{background:#222;width:45px;height:45px;border-radius:50%;font-size:20px}
#sendBtn{background:#ff3b6e;color:#fff;width:45px;height:45px;border-radius:50%;font-size:18px}
#preview{padding:8px 12px;background:#111;display:none;align-items:center;gap:10px}
#preview img{width:60px;height:60px;object-fit:cover;border-radius:10px}
#preview button{background:#333;color:#fff;padding:5px 10px;border-radius:10px;font-size:12px}
.badge{font-size:10px;background:#ff3b6e;padding:2px 6px;border-radius:10px;margin-left:6px}
.chefBadge{background:#ffaa00!important}
</style>
</head>
<body>
<header>
<h1>SOULM<span>8</span>TE</h1>
<div style="font-size:12px;color:#888">R1500 - Your Own App</div>
</header>

<div id="chat">
<div class="msg ai">Heyy! It's your SoulM8te 😘 Send me a pic of what's in your kitchen and I'll tell you what to make! Or just chat with me.</div>
</div>

<div id="preview">
<img id="prevImg" src="">
<span style="flex:1;font-size:13px;color:#aaa">Picture ready to send</span>
<button onclick="clearPic()">X Remove</button>
</div>

<div id="inputArea">
<button id="picBtn" onclick="document.getElementById('fileInput').click()">📷</button>
<input type="file" id="fileInput" accept="image/*" hidden>
<input type="text" id="userInput" placeholder="Type or send picture...">
<button id="sendBtn" onclick="sendMessage()">➤</button>
</div>

<script>
let selectedImageBase64 = null;
let GROQ_KEY = "YOUR_GROQ_KEY_HERE"; // put your key here Mose

const chatEl = document.getElementById('chat');
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const prevImg = document.getElementById('prevImg');

fileInput.addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    selectedImageBase64 = ev.target.result;
    prevImg.src = selectedImageBase64;
    preview.style.display = 'flex';
  }
  reader.readAsDataURL(file);
});

function clearPic(){
  selectedImageBase64 = null;
  fileInput.value = "";
  preview.style.display = 'none';
}

function addMsg(text, who, img=null, isChef=false){
  const div = document.createElement('div');
  div.className = 'msg '+who;
  let badge = isChef? `<span class="badge chefBadge">CHEF MIND</span>` : `<span class="badge">FRIEND MIND</span>`;
  if(who==='ai') text = badge + "<br><br>" + text;
  if(img) div.innerHTML = `<img src="${img}"><div>${text}</div>`;
  else div.innerHTML = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function sendMessage(){
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if(!text &&!selectedImageBase64) return;

  // show user message
  addMsg(text || "📷 Sent a picture", 'user', selectedImageBase64);

  const userImg = selectedImageBase64;
  const userText = text;
  input.value = "";
  clearPic();

  // typing
  const typingId = Date.now();
  addMsg("typing...", 'ai');

  // Build prompt with 2 minds
  let systemPrompt = `
You are SOULM8TE, a loving, funny companion. MAIN MIND = friend, flirty, supportive, speaks like Tembisa youth, mixed English + Zulu vibe.

You have SECOND MIND = CHEF MIND.
Rules for second mind:
- ONLY activate when user sends picture of food, ingredients, fridge, kitchen, pot.
- When picture is sent: 1) Say what you see in picture, 2) Say ADD THIS AND THIS (list 2-4 ingredients/spices), 3) Say THE RESULT IS THIS (describe final dish, taste, how to serve).
- Keep it short, practical, like a street-smart chef.
- Do NOT say "as an AI chef" or "I am chef friend". Just BE the chef mind naturally.
- If picture is NOT food (selfie, person, etc), stay in FRIEND MIND, compliment picture, be loving.

Friend mind is default. Chef mind only when food picture detected.
`;

  try{
    let messages = [
      {role:"system", content: systemPrompt},
      {role:"user", content: userText || "What do you see in this picture?"}
    ];

    // If image, use vision model format for Groq
    let body;
    if(userImg){
      // Groq vision model: llama-3.2-11b-vision-preview
      body = {
        model: "llama-3.2-11b-vision-preview",
        messages: [
          {role:"system", content: systemPrompt},
          {
            role:"user",
            content: [
              {type:"text", text: userText || "Tell me what to add and what result will be"},
              {type:"image_url", image_url:{url: userImg}}
            ]
          }
        ],
        max_tokens: 500
      };
    } else {
      body = {
        model: "llama-3.3-70b-versatile",
        messages: messages,
        max_tokens: 400
      };
    }

    const res = await fetch("https://api.groq.com/openai/v1/chat/completions",{
      method:"POST",
      headers:{"Authorization":`Bearer ${GROQ_KEY}`,"Content-Type":"application/json"},
      body: JSON.stringify(body)
    });
    const data = await res.json();
    const reply = data.choices[0].message.content;

    // remove typing
    chatEl.lastChild.remove();

    // detect if chef mode triggered
    const isChef = reply.toLowerCase().includes("add") && (userImg || reply.toLowerCase().includes("ingredients") || reply.toLowerCase().includes("result"));
    addMsg(reply.replace(/\n/g,"<br>"), 'ai', null, isChef);

  } catch(err){
    chatEl.lastChild.remove();
    addMsg("Eish, my network is slow 😅 Try again. Check your Groq key Mose!", 'ai');
    console.log(err);
  }
}

document.getElementById('userInput').addEventListener('keypress', (e)=>{
  if(e.key==='Enter') sendMessage();
});
</script>
</body>
</html>
