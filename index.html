<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUNGA AI - Smartest Ever</title>
<style>
body{margin:0;font-family:Arial;background:#000;color:white;padding:10px}
#chat{height:65vh;overflow-y:auto;background:#0f0f0f;border-radius:12px;padding:12px;border:1px solid #222}
.msg{margin:8px 0;padding:10px 14px;border-radius:14px;max-width:85%;line-height:1.4}
.user{background:#0A84FF;margin-left:auto;text-align:right}
.bot{background:#1c1c1e}
.ai-think{color:#00ff88;font-size:11px}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #333;background:#1a1a1a;color:white;margin-top:10px}
.btn{width:100%;padding:14px;border-radius:10px;border:none;font-weight:bold;margin:4px 0}
.paypal{background:#0070BA;color:white}
.wa{background:#25D366;color:black}
</style>
</head>
<body>
<h3 style="text-align:center;margin:5px">🧠 LUNGA AI - SMART v2<br><small style="color:#00ff88">Smartest AI from Pieterskraal • Remembers • Offline</small></h3>
<div id="chat"><div class="msg bot">I am LUNGA AI, built by Christian in Pieterskraal. I am not dumb chatbot - I am smart AI that remembers, reasons, and knows Toyota fleet, mines, business. <br><br>What is your name and what business do you do?</div></div>
<input id="inp" placeholder="Ask me anything smart..." onkeypress="if(event.key==='Enter')go()">
<div style="display:flex;gap:6px;margin-top:6px">
<button onclick="go()" style="flex:1;background:#00ff88;color:black;padding:12px;border-radius:10px;font-weight:bold;border:none">Send 🚀</button>
<button onclick="clearMem()" style="background:#333;color:white;padding:12px;border-radius:10px;border:none">Reset</button>
</div>
<button class="btn paypal" onclick="window.open('https://paypal.me/ChristianhMosehla/100000','_blank')">💳 BUY $100k Fleet - PayPal.me/ChristianhMosehla</button>
<button class="btn wa" onclick="window.open('https://wa.me/27835043035?text=Hi%20Christian%20smart%20AI%20is%20ready','_blank')">💬 WhatsApp 0835043035</button>

<script>
let mem = JSON.parse(localStorage.getItem('lunga_smart') || '{"name":"","biz":"","cars":0,"visits":0}');
mem.visits++;
localStorage.setItem('lunga_smart', JSON.stringify(mem));

function add(t,who,think){
 let c=document.getElementById('chat');
 let d=document.createElement('div');
 d.className='msg '+who;
 d.innerHTML=(think?`<div class="ai-think">🧠 ${think}</div>`:'')+t;
 c.appendChild(d);
 c.scrollTop=c.scrollHeight;
}
if(mem.name) add(`Welcome back <b>${mem.name}</b>! I remember you - visit #${mem.visits}. Your business: ${mem.biz||'not yet saved'}. How can I help smarter today?`,'bot','Memory loaded from offline storage');

function go(){
 let i=document.getElementById('inp');
 let q=i.value.trim();
 if(!q)return;
 add(q,'user');
 i.value='';
 
 setTimeout(()=>{
  let l=q.toLowerCase();
  let ans=''; let think='';
  
  // SMART REASONING ENGINE
  if(!mem.name){
   mem.name=q.split(' ')[0].replace(/[^a-zA-Z]/g,'');
   think='Detected name entity, saving to memory';
   ans=`Got it. I will call you <b>${mem.name}</b> from now on. I saved you offline in my brain. What business do you run? Taxi, shop, mine transport, lodge?`;
  }
  else if(l.includes('my business')||l.includes('i do')||l.includes('i run')||l.includes('taxi')||l.includes('shop')||l.includes('mine')||l.includes('truck')){
   mem.biz=q;
   think='Business context detected, updating business memory';
   ans=`Smart. I saved: <b>${q}</b> for ${mem.name}. For that business, my AI can: <br>1. Auto-reply to customers on WhatsApp 0835043035<br>2. Remember customers<br>3. Work offline on N4 corridor<br>4. Make you R5k-R20k/month extra. Want me to calculate profit?`;
  }
  else if(l.includes('toyota')||l.includes('hilux')||l.includes('quantum')||l.includes('car')||l.includes('fleet')){
   think='Toyota fleet intent - providing fleet intelligence';
   ans=`${mem.name}, Toyota fleet secret from Pieterskraal:<br><br>• My AI plugs into Toyota ECU, reads fuel, driver behavior OFFLINE (no signal needed in mines)<br>• Remembers 10,000 drivers by face/voice<br>• Saves 15% fuel = R3,000 per Hilux per month<br>• For 100 Hilux = R300k saved. That's why $100k license is cheap.<br><br>PayPal: <b>paypal.me/ChristianhMosehla/100000</b>`;
  }
  else if(l.includes('smart')||l.includes('how you smart')||l.includes('what can you do')){
   think='Capability query - listing advanced reasoning';
   ans=`${mem.name}, I am smart because:<br>✓ I REMEMBER you offline (localStorage) - ChatGPT forgets without internet<br>✓ I REASON: If you say 'my taxi' I know you need taxi AI<br>✓ I KNOW context: Pieterskraal, Siyabuswa, Emalahleni mines, N4 trucks<br>✓ I CALCULATE: fuel, profit, fleet costs instantly<br>✓ I SPEAK: English, Sepedi (Dumela), Zulu (Sawubona)<br>✓ I WORK offline - no data needed in bush<br><br>Ask me: 'Calculate profit for 5 taxis' or 'Translate to Sepedi'`;
  }
  else if(l.includes('calculate')||l.includes('profit')||l.includes('how much')||l.includes('r')||l.match(/\d+/)){
   think='Math engine - extracting numbers and calculating';
   let nums=q.match(/\d+/g);
   let n=nums?parseInt(nums[0]):5;
   ans=`Calculation for ${mem.name}:<br>If you have ${n} taxis/vehicles:<br>• My AI saves ~R2,500 fuel each = R${(n*2500).toLocaleString()}/month<br>• Adds R5k AI fee you charge = R${(n*5000).toLocaleString()}/month income<br>• Total benefit = R${(n*7500).toLocaleString()}/month<br><br>Fleet license $100k pays back in ${(100000*18/n/7500).toFixed(1)} months. Smart investment.`;
  }
  else if(l.includes('sepedi')||l.includes('pedi')||l.includes('zulu')||l.includes('translate')){
   think='Language engine - multilingual';
   ans=`${mem.name}, I speak:<br>Sepedi: Dumela ${mem.name}! Ke LUNGA AI go tswa Pieterskraal. Nka go thuša ka kgwebo.<br>Zulu: Sawubona ${mem.name}! Ngingu LUNGA AI wase Pieterskraal. Ngingakusiza ngebhizinisi.<br>English: Hello ${mem.name}! I am LUNGA AI from Pieterskraal, I can help your ${mem.biz||'business'}.`;
  }
  else if(l.includes('paypal')||l.includes('buy')||l.includes('price')||l.includes('100k')||l.includes('5000')){
   think='Buying intent - closing sale';
   ans=`${mem.name}, ready to buy?<br><br>💳 <b>PayPal:</b> paypal.me/ChristianhMosehla<br>• R5k/mo: paypal.me/ChristianhMosehla/5000<br>• R50k lifetime: /50000<br>• $100k fleet: /100000 (pay $5k deposit first, rest bank transfer)<br><br>💬 WhatsApp: 0835043035<br>I will send you license in 5 minutes after payment.`;
  }
  else {
   think='General intelligence - contextual response';
   ans=`${mem.name}, smart question. Based on what I know about you (business: ${mem.biz||'not yet told me'}, visits: ${mem.visits}), here's my smart take:<br><br>"${q}" - This is important for someone in Dr JS Moroka doing ${mem.biz||'business'}. My AI can automate this. Tell me more about your ${mem.biz||'work'} and I will give you a custom plan to make extra R10k/month with AI. I remember everything you tell me, offline.`;
  }
  
  add(ans,'bot',think);
  localStorage.setItem('lunga_smart', JSON.stringify(mem));
 },500);
}

function clearMem(){
 localStorage.removeItem('lunga_smart');
 location.reload();
}
</script>
</body>
</html>
