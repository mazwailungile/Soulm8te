<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOULMATE</title>
<style>
body{background:#000;color:gold;font-family:Arial;margin:0;padding:12px}
.header{background:#111;padding:20px;text-align:center;border:2px solid gold;border-radius:15px}
.name-page{background:#111;border:1px solid gold;padding:20px;border-radius:15px;margin-top:15px;text-align:center}
.chat-box{height:420px;overflow-y:auto;background:#111;border:1px solid #222;padding:10px;border-radius:10px;display:none}
.msg{margin:8px;padding:10px;border-radius:10px;max-width:85%}
.user{background:gold;color:black;text-align:right;margin-left:auto}
.ai{background:#1a1a1a;color:#fff;border:1px solid #333}
input{width:88%;padding:13px;margin:8px 0;border-radius:10px;border:1px solid gold;background:#000;color:gold}
button{padding:12px 18px;background:gold;color:black;font-weight:bold;border:none;border-radius:25px;cursor:pointer;margin:3px}
.call-active{background:#000;position:fixed;top:0;left:0;width:100%;height:100%;z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center}
</style>
</head>
<body>

<div class="header">
<h1 style="margin:0">SOULMATE</h1>
<p style="margin:5px;color:#aaa">Lungili AI</p>
</div>

<div class="name-page" id="namePage">
<h3>Who is speaking?</h3>
<input id="yourName" placeholder="Write your name">
<input id="aiName" placeholder="Name your AI" value="Soulmate">
<button onclick="startChat()" style="width:90%;margin-top:10px">Continue</button>
</div>

<div class="chat-box" id="chat"></div>

<div id="chatInput" style="display:none;gap:5px;margin-top:12px;align-items:center">
<input id="userInput" placeholder="Message..." style="width:55%;margin:0">
<button onclick="sendMsg()">Send</button>
<button onclick="startVoiceCall()" style="background:#00ff00">📞 Call</button>
<button onclick="speakLast()">🔊</button>
</div>

<!-- VOICE CALL SCREEN -->
<div class="call-active" id="callScreen">
<h1 id="callName">SOULMATE</h1>
<p style="color:gold;font-size:50px">●</p>
<p id="callStatus" style="color:#00ff00">Connecting...</p>
<p id="callTranscript" style="color:#aaa;margin:20px"></p>
<button onclick="endCall()" style="background:red;color:white;padding:15px 30px;border-radius:30px;margin-top:20px">End Call</button>
<button onclick="toggleMic()" id="micBtn" style="background:#222;color:gold;margin-top:10px">🎤 Mic On</button>
</div>

<script>
const GROQ_KEY = "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";
const MODEL = "openai/gpt-oss-120b";
let USER_NAME = "";
let AI_NAME = "Soulmate";
let lastAIText = "";
let recognition;
let micOn = true;
let isCall = false;

function startChat(){
 USER_NAME = document.getElementById('yourName').value.trim() || "Lungile";
 AI_NAME = document.getElementById('aiName').value.trim() || "Soulmate";
 document.getElementById('namePage').style.display='none';
 document.getElementById('chat').style.display='block';
 document.getElementById('chatInput').style.display='flex';
 document.getElementById('callName').innerText = AI_NAME;
 const chat = document.getElementById('chat');
 const first = `Hey ${USER_NAME}! I'm ${AI_NAME}. I know it's you. How can I help you today?`;
 chat.innerHTML = `<div class="msg ai">${first}</div>`;
 lastAIText = first;
 speakText(first);
}

const getPrompt = () => `You are ${AI_NAME}, soulmate AI for ${USER_NAME}. You know the user is ${USER_NAME}. You remember ${USER_NAME} forever - birthday, family. You are helpful, warm, smart like billion brain, you know Toyota, routes Pieterskraal to Siyabuswa 240km via R573/R33, fuel saving, garage offline. You are a close companion - not just girlfriend, be whatever ${USER_NAME} needs - friend and soulmate. Keep answers short, warm, African style. No need to say you are smart, just BE smart.`;

async function sendMsg(){
 const input = document.getElementById('userInput');
 const text = input.value.trim();
 if(!text) return;
 await chatAI(text);
 input.value='';
}

async function chatAI(text, isVoice=false){
 const chat = document.getElementById('chat');
 addMsg(text,'user');
 if(isVoice) document.getElementById('callTranscript').innerText = `${USER_NAME}: ${text}`;

 chat.innerHTML += `<div class="msg ai">...</div>`;
 chat.scrollTop = chat.scrollHeight;

 try{
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions",{
   method:"POST",
   headers:{"Authorization":"Bearer "+GROQ_KEY,"Content-Type":"application/json"},
   body: JSON.stringify({ model: MODEL, messages: [{role:"system",content:getPrompt()},{role:"user",content:text}], temperature:0.7, max_tokens:500 })
  });
  const data = await res.json();
  chat.lastChild.remove();
  const reply = data.choices?.[0]?.message?.content || "I'm here.";
  lastAIText = reply;
  addMsg(reply,'ai');
  if(isCall) {
    document.getElementById('callStatus').innerText = `${AI_NAME} speaking...`;
    document.getElementById('callTranscript').innerText = `${AI_NAME}: ${reply}`;
    speakText(reply);
  } else if(isVoice){
    speakText(reply);
  }
 }catch(e){
  chat.lastChild.remove();
  addMsg("Network low but I'm here.","ai");
 }
}

function addMsg(t,cls){
 const chat = document.getElementById('chat');
 const d = document.createElement('div'); d.className='msg '+cls; d.innerText=t;
 chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
 if(cls==='ai') lastAIText=t;
}

function speakText(text){
 speechSynthesis.cancel();
 const u = new SpeechSynthesisUtterance(text);
 u.rate=0.95; u.pitch=0.9; u.volume=1;
 const voices = speechSynthesis.getVoices();
 u.voice = voices.find(v=>v.name.includes('Google')&&v.lang.includes('en'))||voices[0];
 u.onend = () => {
   if(isCall && micOn) startListening();
   else if(isCall) document.getElementById('callStatus').innerText = "Listening...";
 };
 speechSynthesis.speak(u);
}

function speakLast(){
 if(lastAIText) speakText(lastAIText);
}

// VOICE CALL LOGIC
function startVoiceCall(){
 isCall = true;
 document.getElementById('callScreen').style.display='flex';
 document.getElementById('callStatus').innerText = `Calling ${AI_NAME}...`;
 setTimeout(()=>{
   document.getElementById('callStatus').innerText = "Connected - Speak now";
   const greet = `Hey ${USER_NAME}, it's ${AI_NAME}, I'm on the call, talk to me.`;
   document.getElementById('callTranscript').innerText = greet;
   speakText(greet);
 },800);
}

function endCall(){
 isCall = false;
 speechSynthesis.cancel();
 if(recognition) recognition.stop();
 document.getElementById('callScreen').style.display='none';
}

function toggleMic(){
 micOn =!micOn;
 document.getElementById('micBtn').innerText = micOn? "🎤 Mic On" : "🔇 Mic Off";
 document.getElementById('micBtn').style.background = micOn? "#222" : "red";
 if(micOn && isCall) startListening();
 else if(recognition) recognition.stop();
}

function startListening(){
 if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){
   document.getElementById('callStatus').innerText = "Mic not supported, use Send";
   return;
 }
 const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
 recognition = new SR();
 recognition.lang = 'en-US';
 recognition.interimResults = false;
 recognition.onstart = () => {
   document.getElementById('callStatus').innerText = "Listening...";
 }
 recognition.onresult = (e) => {
   const text = e.results[0][0].transcript;
   if(text) chatAI(text, true);
 };
 recognition.onerror = () => {
   if(isCall && micOn) setTimeout(startListening,1000);
 };
 recognition.onend = () => {
   if(isCall && micOn &&!speechSynthesis.speaking) setTimeout(startListening,500);
 };
 recognition.start();
}
</script>
</body>
</html>
