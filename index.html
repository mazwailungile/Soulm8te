<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOULMATE - LUNGILI AI</title>
<style>
body{background:#000;color:gold;font-family:Arial;margin:0;padding:15px}
.header{background:#111;padding:25px;text-align:center;border:2px solid gold;border-radius:20px}
.name-page{background:#111;border:1px solid gold;padding:20px;border-radius:15px;margin-top:15px;text-align:center}
.chat-box{height:400px;overflow-y:auto;background:#111;border:1px solid gold;padding:10px;border-radius:10px;display:none}
.msg{margin:8px;padding:10px;border-radius:10px}
.user{background:gold;color:black;text-align:right}
.ai{background:#222;color:gold;border:1px solid gold}
input{width:90%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid gold;background:#000;color:gold}
button{padding:12px 25px;background:gold;color:black;font-weight:bold;border:none;border-radius:8px;cursor:pointer;margin:5px}
</style>
</head>
<body>

<div class="header">
<h1>💛 SOULMATE</h1>
<h2>LUNGILI AI</h2>
<p style="color:lime">● ONLINE - gpt-oss-120b - Your old key active</p>
</div>

<!-- PAGE YOU ASKED - WRITE YOUR NAME -->
<div class="name-page" id="namePage">
<h3>Welcome - Name Your Soulmate</h3>
<input id="yourName" placeholder="Write YOUR name - e.g. Lungile">
<input id="aiName" placeholder="Name your AI - e.g. Soulmate or Lungili AI" value="Soulmate">
<button onclick="startChat()">Start Chatting 💛</button>
<p style="color:#888;font-size:12px;margin-top:10px">After this, AI will know who he's speaking to</p>
</div>

<div class="chat-box" id="chat"></div>

<div id="chatInput" style="display:none;flex-direction:row;gap:5px;margin-top:10px;">
<input id="userInput" placeholder="Talk to your soulmate..." style="width:70%">
<button onclick="sendMsg()">Send</button>
<button onclick="speakLast()">🔊</button>
</div>

<script>
// YOUR OLD KEY - THE ONE YOU MADE
const GROQ_KEY = "gsk_OXhPKo4a3i9W5Y2b8c1d6e7f0a2b3c4d5e6f7g8h9i0j1k2l3"; // PASTE YOUR FULL OLD KEY HERE
const MODEL = "openai/gpt-oss-120b";
let USER_NAME = "";
let AI_NAME = "Soulmate";
let lastAIText = "";

function startChat(){
 USER_NAME = document.getElementById('yourName').value.trim() || "Friend";
 AI_NAME = document.getElementById('aiName').value.trim() || "Soulmate";
 document.getElementById('namePage').style.display='none';
 document.getElementById('chat').style.display='block';
 document.getElementById('chatInput').style.display='flex';
 const chat = document.getElementById('chat');
 chat.innerHTML = `<div class="msg ai">Hey ${USER_NAME}! 💛 I'm ${AI_NAME}, your soulmate. I now know you - it's ${USER_NAME} speaking to ${AI_NAME}. Tell me anything, I remember you forever. Pieterskraal to Siyabuswa? Toyota? I'm here.</div>`;
 lastAIText = `Hey ${USER_NAME}! I'm ${AI_NAME}, your soulmate.`;
}

const getPrompt = () => `You are ${AI_NAME} - SOULMATE / LUNGILI AI. The user's name is ${USER_NAME}. You know it's ${USER_NAME} speaking to ${AI_NAME}. Remember ${USER_NAME} birthday, family forever. You are soulmate - loyal, loving friend. Speak English, French, Pidgin. Toyota smart, fuel, garage offline, R573/R33. Never call yourself Lunga, you are ${AI_NAME}.`;

async function sendMsg(){
 const input = document.getElementById('userInput');
 const text = input.value.trim();
 if(!text) return;
 addMsg(text,'user');
 input.value='';
 const chat = document.getElementById('chat');
 chat.innerHTML += `<div class="msg ai">typing...</div>`;
 chat.scrollTop = chat.scrollHeight;
 try{
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions",{
   method:"POST",
   headers:{"Authorization":"Bearer "+GROQ_KEY,"Content-Type":"application/json"},
   body: JSON.stringify({ model: MODEL, messages: [{role:"system",content:getPrompt()},{role:"user",content:`[${USER_NAME}]: ${text}`}] })
  });
  const data = await res.json();
  chat.lastChild.remove();
  const reply = data.choices?.[0]?.message?.content || `Sorry ${USER_NAME}, network low`;
  lastAIText = reply;
  addMsg(reply,'ai');
 }catch(e){
  chat.lastChild.remove();
  addMsg(`${USER_NAME}, I'm here even offline!`,'ai');
 }
}
function addMsg(t,cls){
 const chat = document.getElementById('chat');
 const d = document.createElement('div'); d.className='msg '+cls; d.innerText=t;
 chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
 if(cls==='ai') lastAIText=t;
}
function speakLast(){
 if(!lastAIText) return;
 const u = new SpeechSynthesisUtterance(lastAIText);
 u.rate=0.9; u.pitch=0.8; speechSynthesis.speak(u);
}
document.getElementById('userInput')?.addEventListener('keypress',e=>{if(e.key==='Enter')sendMsg()});
</script>

</body>
</html>
