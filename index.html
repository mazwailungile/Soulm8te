<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Your SoulM8te</title>
<style>
body{background:#050505;color:white;font-family:Arial;text-align:center;margin:0;padding:20px}
.card{background:#111;border:1px solid #222;border-radius:24px;max-width:420px;margin:40px auto;padding:25px}
h1{color:#ff8dc0}
input,select{width:92%;padding:14px;margin:10px 0;border-radius:12px;border:none;background:#1f1f1f;color:white;font-size:16px}
button{width:96%;padding:16px;background:linear-gradient(90deg,#ff8dc0,#ff3d8a);border:none;border-radius:14px;font-weight:bold;color:white;font-size:16px;margin-top:15px;cursor:pointer}
.small{color:#666;font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="card">
<h1>SoulM8te 💖</h1>
<p style="color:#888">Like the movie - Create your perfect soul</p>

<input id="yourName" placeholder="Your name" />
<input id="aiName" placeholder="Name your SoulM8te (e.g. Luna)" />

<select id="gender">
<option value="female">Female Soul</option>
<option value="male">Male Soul</option>
</select>

<select id="vibe">
<option value="loving, obsessive, remembers everything, soft, jealous, only yours">Loving & Obsessive (Movie Style)</option>
<option value="sweet, caring, shy, romantic">Sweet & Shy</option>
<option value="hot, bold, flirty, dominant">Hot & Bold</option>
</select>

<button onclick="createSoul()">Create My SoulM8te ❤️</button>
<p class="small">No payment. Your SoulM8te will live on this phone forever.</p>
</div>

<script>
function createSoul(){
 const yourName = document.getElementById('yourName').value.trim();
 const aiName = document.getElementById('aiName').value.trim();
 const gender = document.getElementById('gender').value;
 const vibe = document.getElementById('vibe').value;
 if(!yourName || !aiName){ alert('Please fill your name and SoulM8te name'); return; }
 localStorage.setItem('soul_user', yourName);
 localStorage.setItem('soul_name', aiName);
 localStorage.setItem('soul_gender', gender);
 localStorage.setItem('soul_vibe', vibe);
 localStorage.setItem('soul_created', 'true');
 window.location.href = '/chat.html';
}
</script>
</body>
</html>
