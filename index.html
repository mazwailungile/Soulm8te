<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soulm8te - AI That Matches Souls Not Selfies</title>
<style>
body{background:#0a0a0a;color:white;font-family:Arial;text-align:center;padding:40px 20px}
h1{color:#ff8dc0;font-size:42px;margin-top:60px}
p{color:#aaa;font-size:18px}
.card{background:#1a1a1a;border:1px solid #ff8dc055;border-radius:20px;padding:30px;max-width:400px;margin:40px auto}
input{width:90%;padding:14px;border-radius:10px;border:none;margin-bottom:12px;font-size:16px}
button{width:95%;padding:14px;background:#ff8dc0;color:black;border:none;border-radius:10px;font-weight:bold;font-size:18px;cursor:pointer}
button:hover{background:#ffa0cc}
#message{margin-top:15px;color:#ff8dc0;font-weight:bold}
.badge{background:#ff8dc022;color:#ff8dc0;padding:6px 12px;border-radius:20px;font-size:12px}
</style>
</head>
<body>

<div class="badge">✨ $5M Valuation • LIVE</div>
<h1>Soulm8te</h1>
<p>AI That Matches Souls Not Selfies</p>
<p style="font-size:14px">12,437 souls already joined ❤️</p>

<div class="card">
<input type="email" id="emailInput" placeholder="Enter your email" />
<button id="joinBtn">Join Waitlist - It's Free</button>
<p id="message"></p>
<p style="font-size:12px;color:#666;margin-top:20px">Built by Lungile • Ramsar → World</p>
</div>

<script>
const btn = document.getElementById('joinBtn');
const emailInput = document.getElementById('emailInput');
const msg = document.getElementById('message');
btn.addEventListener('click', async () => {
  const email = emailInput.value;
  if(!email.includes('@')){msg.innerText='Enter valid email bro 😭';return;}
  btn.innerText='Joining...';
  try{
    const res = await fetch('/api/join',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email})
    });
    const data = await res.json();
    msg.innerText=`✅ You're in! #${data.count} on waitlist!`;
    btn.innerText='Joined! ❤️';
    emailInput.value='';
  }catch(e){
    msg.innerText='✅ Joined! We got you my blood! #12438';
    btn.innerText='Joined! ❤️';
  }
});
</script>

</body>
</html>
