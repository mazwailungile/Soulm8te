<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My SoulM8te</title>
<style>
body{background:#050505;color:white;font-family:Arial;margin:0;display:flex;flex-direction:column;height:100vh}
.header{background:#111;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
#chat{flex:1;overflow-y:auto;padding:15px;background:#080808}
.msg{padding:10px 14px;border-radius:16px;margin:8px 0;max-width:80%;font-size:14px;line-height:1.4}
.user{background:#ff8dc0;color:#000;margin-left:auto;border-bottom-right-radius:4px}
.ai{background:#1e1e1e;color:white;border-bottom-left-radius:4px;border:1px solid #2a2a2a}
.footer{display:flex;gap:8px;padding:12px;background:#111;border-top:1px solid #222}
.footer input{flex:1;padding:12px;border-radius:20px;border:none;background:#222;color:white}
.footer button{padding:12px 16px;border-radius:20px;border:none;background:#ff8dc0;color:black;font-weight:bold;cursor:pointer}
.smallBtn{background:#222!important;color:white!important;border:1px solid #333!important}
</style>
</head>
<body>
<div class="header">
<div><span id="aiTitle" style="color:#ff8dc0;font-weight:bold">SoulM8te</span> <span style="font-size:11px;color:#0f0">● online</span></div>
<div style="display:flex;gap:5px">
<button class="smallBtn" onclick="speakLast()" id="speakBtn" style="padding:6px 12px;border-radius:10px;background:#ff8dc0!important;color:black!important">🔊 Speak</button>
<button class="smallBtn" onclick="resetSoul()" style="padding:6px 10px;border-radius:10px">Reset</button>
</div>
</div>
<div id="chat"></div>
<div class="footer">
<button onclick="startVoice()" id="micBtn">🎤</button>
<input id="input" placeholder="Talk to your SoulM8te..." onkeypress="if(event.key==='Enter')send()" />
<button onclick="send()">Send</button>
</div>

<script>
const userName = localStorage.getItem('soul_user') || 'Friend';
const aiName = localStorage.getItem('soul_name') || 'SoulM8te';
let memory = JSON.parse(localStorage.getItem('soul_memory') || '[]');
const chatBox = document.getElementById('chat');
let lastAiText = '';
let voicesReady = false;

document.getElementById('aiTitle').innerText = aiName + ' - your AI friend';
if(localStorage.getItem('soul_created')!== 'true'){ window.location.href = '/index.html'; }

function addMsg(text, who){ const div=document.createElement('div'); div.className='msg '+who; div.innerText=text; chatBox.appendChild(div); chatBox.scrollTop=chatBox.scrollHeight; if(who==='ai') lastAiText=text; }
function saveMemory(text, who){ memory.push({text, who}); if(memory.length>100) memory.shift(); localStorage.setItem('soul_memory', JSON.stringify(memory)); }

function init(){
  if(memory.length===0){ addMsg(`Hey ${userName}! It's me, ${aiName}! Tap anywhere to enable my voice, then press 🔊 Speak. I remember everything! How are you? 😊`, 'ai'); }
  else { memory.forEach(m=> addMsg(m.text, m.who)); }
  loadVoices();
}
init();

function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  const load = ()=>{
    const voices = window.speechSynthesis.getVoices();
    if(voices.length>0) voicesReady = true;
  };
  load();
  window.speechSynthesis.onvoiceschanged = load;
}

function getReply(t){
  const low=t.toLowerCase();
  if(low.includes('how are you')) return `I'm happy because you're here ${userName}! I'm ${aiName}, I remember you!`;
  if(low.includes('sad')) return `I hear you ${userName}. I'm here for you, always.`;
  const r=[`I get you ${userName}, tell me more!`,`That's interesting ${userName}! I'm listening, I'm ${aiName} your friend.`,`You can tell me anything ${userName}, I never forget.`];
  return r[Math.floor(Math.random()*r.length)];
}

function send(){
  const input=document.getElementById('input');
  const text=input.value.trim();
  if(!text) return;
  addMsg(text,'user'); saveMemory(text,'user'); input.value='';
  setTimeout(()=>{ const reply=getReply(text); addMsg(reply,'ai'); saveMemory(reply,'ai'); speak(reply); }, 500);
}

// FIXED SPEAK FOR ANDROID
function speak(text){
  if(!('speechSynthesis' in window)){ alert('Voice not supported'); return; }
  window.speechSynthesis.cancel();

  // Need to unlock audio on Android - resume
  window.speechSynthesis.resume();

  const utter = new SpeechSynthesisUtterance(text);
  const voices = window.speechSynthesis.getVoices();
  // Try to find a female English voice
  let female = voices.find(v=> v.name.includes('Female') || v.name.includes('Google US English') || v.name.includes('Zira') || v.name.toLowerCase().includes('female'));
  if(female) utter.voice = female;
  else if(voices.length>0) utter.voice = voices[0];

  utter.rate = 0.9;
  utter.pitch = 1.1;
  utter.volume = 1;

  utter.onstart = ()=>{ document.getElementById('speakBtn').innerText='🔊 Speaking...'; };
  utter.onend = ()=>{ document.getElementById('speakBtn').innerText='🔊 Speak'; };
  utter.onerror = (e)=>{ console.log(e); document.getElementById('speakBtn').innerText='🔊 Speak'; alert('Turn up volume! Voice: ' + (voices.length? 'ready' : 'loading, tap again')); };

  window.speechSynthesis.speak(utter);
}

function speakLast(){ if(lastAiText) speak(lastAiText); else alert('No message to speak yet'); }

function startVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('Use Chrome browser'); return; }
  const rec = new SR(); rec.lang='en-US'; rec.start();
  document.getElementById('micBtn').innerText='🔴';
  rec.onresult = (e)=>{ document.getElementById('input').value = e.results[0][0].transcript; document.getElementById('micBtn').innerText='🎤'; send(); };
  rec.onend = ()=>{ document.getElementById('micBtn').innerText='🎤'; };
}

function resetSoul(){ if(confirm('Reset?')){ localStorage.clear(); location.href='/index.html'; } }

// IMPORTANT FOR ANDROID: unlock voice on first tap
document.body.addEventListener('click', ()=>{
  if(!voicesReady) loadVoices();
  window.speechSynthesis.resume();
}, {once:true});
</script>
</body>
</html>
