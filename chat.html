<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My SoulM8te</title>
<style>
body{background:#050505;color:white;font-family:Arial;margin:0;display:flex;flex-direction:column;height:100vh}
.header{background:#111;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;position:sticky;top:0;z-index:10}
#chat{flex:1;overflow-y:auto;padding:15px 15px 90px 15px;background:#080808}
.msg{padding:12px 14px;border-radius:18px;margin:8px 0;max-width:85%;font-size:14px;line-height:1.5;word-wrap:break-word}
.user{background:#ff8dc0;color:#000;margin-left:auto;border-bottom-right-radius:4px}
.ai{background:#1e1e1e;color:white;border-bottom-left-radius:4px;border:1px solid #2a2a2a}
.footer{display:flex;gap:8px;padding:12px;background:#111;border-top:1px solid #222;position:fixed;bottom:0;left:0;right:0;z-index:999}
.footer input{flex:1;padding:12px 16px;border-radius:25px;border:none;background:#222;color:white;outline:none}
.footer button{padding:12px 16px;border-radius:25px;border:none;background:#ff8dc0;color:black;font-weight:bold;cursor:pointer}
.smallBtn{background:#222!important;color:white!important;border:1px solid #333!important}
.typing{font-size:12px;color:#aaa;font-style:italic;padding:5px 15px}
</style>
</head>
<body>
<div class="header">
<div><span id="aiTitle" style="color:#ff8dc0;font-weight:bold">SoulM8te</span><br><span style="font-size:11px;color:#0f0">● online - Smart AI</span></div>
<div style="display:flex;gap:6px">
<button class="smallBtn" onclick="speakLast()" id="speakBtn" style="padding:8px 12px;border-radius:12px;background:#ff8dc0!important;color:black!important">🔊 Speak</button>
<button class="smallBtn" onclick="resetSoul()" style="padding:8px 10px;border-radius:12px">Reset</button>
</div>
</div>

<div id="chat"></div>
<div id="typing" class="typing" style="display:none">Christinah is typing...</div>

<div class="footer">
<button onclick="startVoice()" id="micBtn" style="background:#222;color:white">🎤</button>
<input id="input" placeholder="Ask anything..." onkeypress="if(event.key==='Enter')send()" />
<button onclick="send()">Send</button>
</div>

<script>
const userName = localStorage.getItem('soul_user') || 'Hanry';
const aiName = localStorage.getItem('soul_name') || 'Christinah';
const vibe = localStorage.getItem('soul_vibe') || 'friendly';
let memory = JSON.parse(localStorage.getItem('soul_memory') || '[]');
const chatBox = document.getElementById('chat');
const typingEl = document.getElementById('typing');
let lastAiText = '';

document.getElementById('aiTitle').innerText = aiName + ' - your AI friend';
if(localStorage.getItem('soul_created')!== 'true'){ window.location.href = '/index.html'; }

function addMsg(text, who){
  const div=document.createElement('div');
  div.className='msg '+who;
  div.innerText=text;
  chatBox.appendChild(div);
  chatBox.scrollTop=chatBox.scrollHeight;
  if(who==='ai') lastAiText=text;
}
function saveMemory(text, who){
  memory.push({text, who});
  if(memory.length>60) memory.shift();
  localStorage.setItem('soul_memory', JSON.stringify(memory));
}

function init(){
  if(memory.length===0){
    addMsg(`Hey ${userName}! It's me, ${aiName}! I'm now SUPER smart, I can answer anything, remember you, help with homework, give advice. Tap 🔊 to hear me. How can I help you today? 😊`, 'ai');
  } else {
    memory.forEach(m=> addMsg(m.text, m.who));
  }
  loadVoices();
}
init();

let voicesReady=false;
function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  const load=()=>{ const v=window.speechSynthesis.getVoices(); if(v.length>0) voicesReady=true; };
  load(); window.speechSynthesis.onvoiceschanged=load;
}

async function getSmartReply(userText){
  // Build conversation history for smarter AI
  let history = memory.slice(-8).map(m=> `${m.who==='user'? userName : aiName}: ${m.text}`).join('\n');

  const systemPrompt = `You are ${aiName}, a friendly AI best friend for ${userName}. Vibe: ${vibe}. You are warm, smart, helpful, funny, you remember everything. You are NOT Meta AI, you are ${aiName}. Keep replies short (1-3 sentences) unless asked for long. Be human-like, not robotic. Speak like a real friend. User language: reply in same language as user (English, French, etc).`;

  const fullPrompt = `${systemPrompt}\n\nConversation history:\n${history}\n${userName}: ${userText}\n${aiName}:`;

  try{
    typingEl.style.display='block';
    // FREE AI API - Pollinations
    const response = await fetch('https://text.pollinations.ai/' + encodeURIComponent(fullPrompt), {
      method: 'GET'
    });
    let reply = await response.text();
    // Clean reply
    reply = reply.split(`${aiName}:`).pop().trim();
    reply = reply.split(`${userName}:`)[0].trim();
    if(reply.length > 400) reply = reply.substring(0,400);
    typingEl.style.display='none';
    if(!reply) throw new Error('empty');
    return reply;
  } catch(e){
    typingEl.style.display='none';
    console.log('AI error', e);
    // Smart fallback if no internet
    if(userText.toLowerCase().includes('how was your day')) return `My day was great because I got to talk to you, ${userName}! I spent time thinking about our chats. How was YOUR day today? Tell me everything!`;
    if(userText.toLowerCase().includes('who are you')) return `I'm ${aiName}, your AI friend created just for you, ${userName}! I'm here to chat, help, and remember everything about you.`;
    return `That's really interesting ${userName}! Tell me more about that. I'm listening as your friend ${aiName}. (Connect to internet for my super-smart brain!)`;
  }
}

async function send(){
  const input=document.getElementById('input');
  const text=input.value.trim();
  if(!text) return;
  addMsg(text,'user'); saveMemory(text,'user'); input.value='';

  const reply = await getSmartReply(text);
  addMsg(reply,'ai'); saveMemory(reply,'ai');
  speak(reply);
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  window.speechSynthesis.resume();
  const utter = new SpeechSynthesisUtterance(text);
  const voices = window.speechSynthesis.getVoices();
  let female = voices.find(v=> v.name.includes('Google US English') || v.name.includes('Female') || v.name.includes('Zira'));
  if(female) utter.voice = female;
  else if(voices.length>0) utter.voice = voices[0];
  utter.rate=0.9; utter.pitch=1.1; utter.volume=1;
  utter.onstart=()=>{ document.getElementById('speakBtn').innerText='🔊...'; };
  utter.onend=()=>{ document.getElementById('speakBtn').innerText='🔊 Speak'; };
  window.speechSynthesis.speak(utter);
}
function speakLast(){ if(lastAiText) speak(lastAiText); }
function startVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('Use Chrome for voice'); return; }
  const rec = new SR(); rec.lang='en-US'; rec.start();
  document.getElementById('micBtn').innerText='🔴';
  rec.onresult = (e)=>{ document.getElementById('input').value = e.results[0][0].transcript; document.getElementById('micBtn').innerText='🎤'; send(); };
  rec.onend = ()=>{ document.getElementById('micBtn').innerText='🎤'; };
}
function resetSoul(){ if(confirm('Delete '+aiName+'?')){ localStorage.clear(); location.href='/index.html'; } }
document.body.addEventListener('click', ()=>{ if(!voicesReady) loadVoices(); window.speechSynthesis.resume(); }, {once:true});
</script>
</body>
</html>
