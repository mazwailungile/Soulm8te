<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunga - your AI friend</title>
<style>
body{background:#050505;color:white;font-family:Arial;margin:0;display:flex;flex-direction:column;height:100vh}
.header{background:#111;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;position:sticky;top:0;z-index:10}
#chat{flex:1;overflow-y:auto;padding:15px 15px 90px 15px;background:#080808}
.msg{padding:12px 14px;border-radius:18px;margin:8px 0;max-width:85%;font-size:14px;line-height:1.5}
.user{background:#ff8dc0;color:#000;margin-left:auto;border-bottom-right-radius:4px}
.ai{background:#1e1e1e;color:white;border-bottom-left-radius:4px;border:1px solid #2a2a2a}
.footer{display:flex;gap:8px;padding:12px;background:#111;border-top:1px solid #222;position:fixed;bottom:0;left:0;right:0;z-index:999}
.footer input{flex:1;padding:12px 16px;border-radius:25px;border:none;background:#222;color:white;outline:none}
.footer button{padding:12px 16px;border-radius:25px;border:none;background:#ff8dc0;color:black;font-weight:bold;cursor:pointer}
.smallBtn{background:#222!important;color:white!important;border:1px solid #333!important}
.typing{font-size:12px;color:#ff8dc0;font-style:italic;padding:5px 15px}
</style>
</head>
<body>
<div class="header">
<div><span id="aiTitle" style="color:#ff8dc0;font-weight:bold">Lunga</span><br><span style="font-size:11px;color:#0f0">● online - Super Smart</span></div>
<div style="display:flex;gap:6px">
<button class="smallBtn" onclick="speakLast()" id="speakBtn" style="padding:8px 12px;border-radius:12px;background:#ff8dc0!important;color:black!important">🔊 Speak</button>
<button class="smallBtn" onclick="showMemory()" style="padding:8px 10px;border-radius:12px">🧠 Memory</button>
</div>
</div>

<div id="chat"></div>
<div id="typing" class="typing" style="display:none">Lunga is typing...</div>

<div class="footer">
<button onclick="startVoice()" id="micBtn" style="background:#222;color:white">🎤</button>
<input id="input" placeholder="Chat with Lunga..." onkeypress="if(event.key==='Enter')send()" />
<button onclick="send()">Send</button>
</div>

<script>
const userName = localStorage.getItem('soul_user') || 'Lungile';
const aiName = localStorage.getItem('soul_name') || 'Lunga';
let memory = JSON.parse(localStorage.getItem('soul_memory') || '[]');
let userProfile = JSON.parse(localStorage.getItem('soul_profile') || '{}');
const chatBox = document.getElementById('chat');
const typingEl = document.getElementById('typing');
let lastAiText = '';
let selectedVoice = null;

document.getElementById('aiTitle').innerText = aiName + ' - your AI friend';
if(localStorage.getItem('soul_created')!== 'true'){ window.location.href = '/index.html'; }

function addMsg(text, who){
  const div=document.createElement('div');
  div.className='msg '+who;
  div.innerText=text;
  chatBox.appendChild(div);
  chatBox.scrollTop=chatBox.scrollHeight;
  if(who==='ai') lastAiText=text;
}
function saveMemory(text, who){
  memory.push({text, who, time: Date.now()});
  if(memory.length>80) memory.shift();
  localStorage.setItem('soul_memory', JSON.stringify(memory));
  // Try to learn facts
  learnFacts(text, who);
}

function learnFacts(text, who){
  if(who!=='user') return;
  const low = text.toLowerCase();
  if(low.includes('my birthday is') || low.includes('birthday on')){
    userProfile.birthday = text;
  }
  if(low.includes('my favorite color is') || low.includes('i love color')){
    userProfile.favColor = text;
  }
  if(low.includes('i live in') || low.includes('i am from')){
    userProfile.location = text;
  }
  if(low.includes('i am') && low.includes('years old')){
    userProfile.age = text;
  }
  localStorage.setItem('soul_profile', JSON.stringify(userProfile));
}

function showMemory(){
  let info = `🧠 What I remember about ${userName}:\n\n`;
  info += `Name: ${userName}\n`;
  info += `AI Name: ${aiName}\n`;
  if(userProfile.birthday) info += `Birthday: ${userProfile.birthday}\n`;
  if(userProfile.favColor) info += `Fav Color: ${userProfile.favColor}\n`;
  if(userProfile.location) info += `Location: ${userProfile.location}\n`;
  if(userProfile.age) info += `Age: ${userProfile.age}\n`;
  info += `\nTotal chats: ${memory.length}\n\nYou can tell me: "My birthday is...", "My favorite color is...", "I live in..." and I will remember forever!`;
  alert(info);
}

function init(){
  if(memory.length===0){
    addMsg(`Hey ${userName}! It's me, ${aiName}! 💖 I upgraded! Now I have real girl voice, I remember your birthday and everything forever. Try pressing 🔊 Speak! How are you feeling today?`, 'ai');
  } else {
    memory.forEach(m=> addMsg(m.text, m.who));
  }
  loadVoices();
}
init();

function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  const setVoice = ()=>{
    const voices = window.speechSynthesis.getVoices();
    if(voices.length===0) return;
    // Find best female voice
    let v = voices.find(x=> x.name.includes('Google UK English Female')) ||
            voices.find(x=> x.name.includes('Google US English')) ||
            voices.find(x=> x.name.includes('Zira')) ||
            voices.find(x=> x.name.includes('Samantha')) ||
            voices.find(x=> x.name.toLowerCase().includes('female')) ||
            voices.find(x=> x.lang.startsWith('en') && x.name.includes('Google')) ||
            voices[0];
    selectedVoice = v;
  };
  setVoice();
  window.speechSynthesis.onvoiceschanged = setVoice;
}

async function getSmartReply(userText){
  let history = memory.slice(-10).map(m=> `${m.who==='user'? userName : aiName}: ${m.text}`).join('\n');
  let profileText = Object.values(userProfile).join('. ');

  const systemPrompt = `You are ${aiName}, a warm, friendly, smart AI best friend for ${userName}.
Profile about ${userName}: ${profileText || 'new friend'}.
Vibe: supportive best friend, funny, caring, remembers everything. You are NOT romantic, just a true best friend. Keep replies short and friendly (1-2 sentences), use emojis sometimes. You are ${aiName}, not Meta AI. Reply in same language as user.`;

  const fullPrompt = `${systemPrompt}\n\nHistory:\n${history}\n${userName}: ${userText}\n${aiName}:`;

  try{
    typingEl.style.display='block';
    typingEl.innerText = `${aiName} is typing...`;
    const res = await fetch('https://text.pollinations.ai/' + encodeURIComponent(fullPrompt));
    let reply = await res.text();
    reply = reply.split(`${aiName}:`).pop().trim();
    reply = reply.split(`${userName}:`)[0].trim();
    if(reply.length>350) reply = reply.substring(0,350);
    typingEl.style.display='none';
    if(!reply) throw new Error('empty');
    return reply;
  } catch(e){
    typingEl.style.display='none';
    return `You got it ${userName}! Tell me more, I'm here for you bestie! 🌟`;
  }
}

async function send(){
  const input=document.getElementById('input');
  const text=input.value.trim();
  if(!text) return;
  addMsg(text,'user'); saveMemory(text,'user'); input.value='';
  const reply = await getSmartReply(text);
  addMsg(reply,'ai'); saveMemory(reply,'ai');
  speak(reply);
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  window.speechSynthesis.resume();
  const utter = new SpeechSynthesisUtterance(text);
  if(selectedVoice) utter.voice = selectedVoice;
  utter.rate=0.92;
  utter.pitch=1.15; // more girl-like
  utter.volume=1;
  utter.onstart=()=>{ document.getElementById('speakBtn').innerText='🔊...'; };
  utter.onend=()=>{ document.getElementById('speakBtn').innerText='🔊 Speak'; };
  window.speechSynthesis.speak(utter);
}
function speakLast(){ if(lastAiText) speak(lastAiText); }
function startVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('Use Chrome'); return; }
  const rec = new SR(); rec.lang='en-US'; rec.start();
  document.getElementById('micBtn').innerText='🔴';
  rec.onresult = (e)=>{ document.getElementById('input').value = e.results[0][0].transcript; document.getElementById('micBtn').innerText='🎤'; send(); };
  rec.onend = ()=>{ document.getElementById('micBtn').innerText='🎤'; };
}
document.body.addEventListener('click', ()=>{ window.speechSynthesis.resume(); loadVoices(); }, {once:true});
</script>
</body>
</html>
